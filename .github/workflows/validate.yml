name: Validate

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile
        run: python -m compileall -q custom_components

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Translation parity
        run: python scripts/check_i18n.py

  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: YAML syntax
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml

          paths = sorted(Path("dashboards").glob("*.yaml"))
          paths += sorted(Path("dashboards/packages").glob("*.yaml"))
          for path in paths:
              yaml.safe_load(path.read_text(encoding="utf-8"))
              print(f"{path}: OK")
          PY
