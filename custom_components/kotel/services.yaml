# Структура служб интеграции ReglerPro Controller.
# Названия и описания служб и полей находятся в strings.json / translations/*.json
# (стандарт Home Assistant с 2023.8). Здесь остаются только схема, селекторы,
# значения по умолчанию и примеры.

send_command:
  fields:
    device_id:
      required: true
      selector:
        text:
    action:
      required: true
      selector:
        text:
    value:
      required: false
      default: 0
      selector:
        number:
          min: -50
          max: 1000
          step: 0.5
          mode: box

# ---------------------------------------------------------------------------
# Профили настроек (профили котла и климата хранятся и применяются отдельно)
# ---------------------------------------------------------------------------
save_profile:
  target:
    device:
      integration: kotel
  fields:
    name:
      required: true
      example: Расписание 7/7 — солнечные дни
      selector:
        text:
    kind:
      required: false
      selector:
        select:
          options:
            - { value: boiler, label: Котёл }
            - { value: climate, label: Климат }
    scopes:
      required: false
      selector:
        select:
          multiple: true
          options:
            - { value: boiler, label: Настройки котла }
            - { value: climate, label: "Климат: режим и цель" }
            - { value: schedule, label: "Климат: расписание" }
            - { value: climate_sensor, label: "Климат: датчик" }
    note:
      required: false
      selector:
        text:
    overwrite:
      required: false
      default: false
      selector:
        boolean:
    all_schedules:
      required: false
      default: false
      selector:
        boolean:

apply_profile:
  target:
    device:
      integration: kotel
  fields:
    name:
      required: true
      example: Отпуск
      selector:
        text:
    kind:
      required: false
      selector:
        select:
          options:
            - { value: boiler, label: Котёл }
            - { value: climate, label: Климат }
    scopes:
      required: false
      selector:
        select:
          multiple: true
          options:
            - { value: boiler, label: Настройки котла }
            - { value: climate, label: "Климат: режим и цель" }
            - { value: schedule, label: "Климат: расписание" }
            - { value: climate_sensor, label: "Климат: датчик" }
    dry_run:
      required: false
      default: false
      selector:
        boolean:
    force:
      required: false
      default: false
      selector:
        boolean:
    verify:
      required: false
      default: true
      selector:
        boolean:

undo_apply:
  target:
    device:
      integration: kotel
  fields:
    kind:
      required: false
      default: boiler
      selector:
        select:
          options:
            - { value: boiler, label: Котёл }
            - { value: climate, label: Климат }
    force:
      required: false
      default: false
      selector:
        boolean:
    verify:
      required: false
      default: true
      selector:
        boolean:

delete_profile:
  target:
    device:
      integration: kotel
  fields:
    name:
      required: true
      selector:
        text:
    kind:
      required: false
      selector:
        select:
          options:
            - { value: boiler, label: Котёл }
            - { value: climate, label: Климат }

rename_profile:
  target:
    device:
      integration: kotel
  fields:
    name:
      required: true
      selector:
        text:
    new_name:
      required: true
      selector:
        text:
    kind:
      required: false
      selector:
        select:
          options:
            - { value: boiler, label: Котёл }
            - { value: climate, label: Климат }

list_profiles:
  target:
    device:
      integration: kotel

export_profiles:
  target:
    device:
      integration: kotel
  fields:
    profiles:
      required: false
      selector:
        text:
          multiple: true
    kind:
      required: false
      selector:
        select:
          options:
            - { value: boiler, label: Котёл }
            - { value: climate, label: Климат }
    to_www:
      required: false
      default: false
      selector:
        boolean:

import_profiles:
  target:
    device:
      integration: kotel
  fields:
    file:
      required: true
      example: kotel_profiles_20261020_101500.json
      selector:
        text:
    profiles:
      required: false
      selector:
        text:
          multiple: true
    kind:
      required: false
      selector:
        select:
          options:
            - { value: boiler, label: Котёл }
            - { value: climate, label: Климат }
    on_conflict:
      required: false
      default: rename
      selector:
        select:
          options:
            - { value: rename, label: Добавить с номером }
            - { value: overwrite, label: Заменить существующий }
            - { value: skip, label: Пропустить }
