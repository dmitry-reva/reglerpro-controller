<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Красная рамка (контур) -->
  <rect x="2" y="2" width="44" height="44" fill="none" stroke="#d32f2f" stroke-width="2" rx="4"/>
  
  <!-- Чёрный корпус панели -->
  <rect x="4" y="4" width="40" height="40" fill="#1a1a1a" rx="3"/>
  
  <!-- Область дисплея (серый) -->
  <rect x="18" y="10" width="14" height="10" fill="#cccccc" rx="2"/>
  
  <!-- Условная сетка для подписей и кнопок (тонкие линии) -->
  <line x1="10" y1="26" x2="38" y2="26" stroke="#888" stroke-width="1"/>
  <line x1="10" y1="30" x2="38" y2="30" stroke="#888" stroke-width="1"/>
  <line x1="10" y1="34" x2="38" y2="34" stroke="#888" stroke-width="1"/>
  <line x1="10" y1="38" x2="38" y2="38" stroke="#888" stroke-width="1"/>
  
  <!-- Условные кнопки (простые квадраты) -->
  <rect x="35" y="10" width="6" height="5" fill="#f00" rx="1"/>
  <rect x="35" y="18" width="6" height="5" fill="#ccc" rx="1"/>
  <rect x="35" y="25" width="6" height="5" fill="#ccc" rx="1"/>
  <rect x="35" y="32" width="6" height="5" fill="#ccc" rx="1"/>
</svg>
