# Панель «Настройки котла» (ReglerPro Controller).
#
# Показывает только названия и значения настроек котла. Нажатие на название открывает окно
# сущности, где значение меняется ползунком; запись уходит в контроллер сразу.
# Состав: 11 настроек (number), сгруппированы по назначению, и 3 параметра шнека «только
# чтение» (sensor): для них в интеграции нет полей записи. Расписание климата, профили
# и старт/стоп сюда не входят.
#
# Применение: Настройки → Панели → Добавить панель → «Новая панель с нуля»; затем
# ⋮ → Raw configuration editor и вставьте содержимое файла.
#
# Идентификаторы сущностей зависят от названия устройства и фиксируются при создании
# сущности, поэтому у вас они могут отличаться. Идентификаторы из вашего прежнего
# дашборда подтверждены, остальные выведены по тому же правилу из названий. Проверьте их:
#   number.kotel_kontroller_shnek_interval_nagrev
#   number.kotel_kontroller_shnek_interval_ugasanie
#   sensor.kotel_kontroller_shnek_rabota_nagrev
#   sensor.kotel_kontroller_shnek_rabota_podderzhanie
#   sensor.kotel_kontroller_shnek_interval_avtoreversa
# Жёлтый знак на строке означает, что сущности с таким ID нет: поправьте entity.
title: Настройки котла
views:
  - title: Настройки
    path: boiler-settings
    icon: mdi:tune
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Настройки котла
            heading_style: title
            icon: mdi:tune
          - type: heading
            heading: Нажмите на название, чтобы изменить значение
            heading_style: subtitle
          - type: heading
            heading: Температуры
            heading_style: subtitle
            icon: mdi:thermometer
          - type: entities
            show_header_toggle: false
            state_color: false
            entities:
              - type: simple-entity
                entity: number.kotel_kontroller_ustavka_temperatury_max
                name: Уставка (макс.)
                icon: mdi:thermometer-high
                tap_action:
                  action: more-info
              - type: simple-entity
                entity: number.kotel_kontroller_ustavka_temperatury_min
                name: Уставка (мин.)
                icon: mdi:thermometer-low
                tap_action:
                  action: more-info
              - type: simple-entity
                entity: number.kotel_kontroller_temperatura_nasosa
                name: Температура насоса
                icon: mdi:water-pump
                tap_action:
                  action: more-info
              - type: simple-entity
                entity: number.kotel_kontroller_korrektsiia_temperatury
                name: Коррекция температуры
                icon: mdi:thermometer-plus
                tap_action:
                  action: more-info
      - type: grid
        cards:
          - type: heading
            heading: Вентилятор и продувка
            heading_style: subtitle
            icon: mdi:fan
          - type: entities
            show_header_toggle: false
            state_color: false
            entities:
              - type: simple-entity
                entity: number.kotel_kontroller_ventiliator_min
                name: Вентилятор (мин.)
                icon: mdi:fan
                tap_action:
                  action: more-info
              - type: simple-entity
                entity: number.kotel_kontroller_ventiliator_max
                name: Вентилятор (макс.)
                icon: mdi:fan
                tap_action:
                  action: more-info
              - type: simple-entity
                entity: number.kotel_kontroller_vremia_produvki
                name: Время продувки
                icon: mdi:timer-outline
                tap_action:
                  action: more-info
              - type: simple-entity
                entity: number.kotel_kontroller_interval_produvki
                name: Интервал продувки
                icon: mdi:timer-sand
                tap_action:
                  action: more-info
      - type: grid
        cards:
          - type: heading
            heading: Угасание и шнек
            heading_style: subtitle
            icon: mdi:fire-off
          - type: entities
            show_header_toggle: false
            state_color: false
            entities:
              - type: simple-entity
                entity: number.kotel_kontroller_vremia_ugasaniia
                name: Время угасания
                icon: mdi:fire-off
                tap_action:
                  action: more-info
              - type: simple-entity
                entity: number.kotel_kontroller_shnek_interval_nagrev
                name: 'Шнек: интервал (нагрев)'
                icon: mdi:cog
                tap_action:
                  action: more-info
              - type: simple-entity
                entity: number.kotel_kontroller_shnek_interval_ugasanie
                name: 'Шнек: интервал (поддержание)'
                icon: mdi:cog
                tap_action:
                  action: more-info
              - type: simple-entity
                entity: number.kotel_kontroller_shnek_rabota_nagrev_2
                name: 'Шнек: работа (нагрев)'
                icon: mdi:timer-play-outline
                tap_action:
                  action: more-info
              - type: simple-entity
                entity: number.kotel_kontroller_shnek_rabota_podderzhanie_2
                name: 'Шнек: работа (поддержание)'
                icon: mdi:timer-play-outline
                tap_action:
                  action: more-info
              - type: simple-entity
                entity: number.kotel_kontroller_shnek_interval_avtoreversa_2
                name: 'Шнек: интервал автореверса'
                icon: mdi:swap-horizontal
                tap_action:
                  action: more-info
          - type: heading
            heading: Только чтение
            heading_style: subtitle
            icon: mdi:eye-outline
          - type: entities
            show_header_toggle: false
            state_color: false
            entities:
              - type: simple-entity
                entity: sensor.kotel_kontroller_shnek_rabota_nagrev
                name: 'Шнек: работа (нагрев)'
                icon: mdi:timer-outline
                tap_action:
                  action: more-info
              - type: simple-entity
                entity: sensor.kotel_kontroller_shnek_rabota_podderzhanie
                name: 'Шнек: работа (поддержание)'
                icon: mdi:timer-outline
                tap_action:
                  action: more-info
              - type: simple-entity
                entity: sensor.kotel_kontroller_shnek_interval_avtoreversa
                name: 'Шнек: интервал автореверса'
                icon: mdi:swap-horizontal
                tap_action:
                  action: more-info
