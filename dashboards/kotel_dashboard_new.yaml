                      color: '#ff3b30'
                      text-shadow: 0 0 8px rgba(255, 59, 48, 0.8)
                      pointer-events: none
              - type: conditional
                conditions:
                  - condition: state
                    entity: input_select.kotel_display_mode
                    state: '4'
                elements:
                  - type: state-label
                    entity: sensor.kotel_kontroller_auger_interval_maintenance
                    style:
                      left: 55.9%
                      top: 33.2%
                      transform: translate(-50%, -50%)
                      font-size: 34px
                      font-weight: bold
                      font-family: Arial, Helvetica, sans-serif
                      color: '#ff3b30'
                      text-shadow: 0 0 8px rgba(255, 59, 48, 0.8)
                      pointer-events: none
              - type: conditional
                conditions:
                  - condition: state
                    entity: input_select.kotel_display_mode
                    state: '5'
                elements:
                  - type: state-label
                    entity: number.kotel_kontroller_purge_time
                    style:
                      left: 55.9%
                      top: 33.2%
                      transform: translate(-50%, -50%)
                      font-size: 34px
                      font-weight: bold
                      font-family: Arial, Helvetica, sans-serif
                      color: '#ff3b30'
                      text-shadow: 0 0 8px rgba(255, 59, 48, 0.8)
                      pointer-events: none
              - type: conditional
                conditions:
                  - condition: state
                    entity: input_select.kotel_display_mode
                    state: '6'
                elements:
                  - type: state-label
                    entity: number.kotel_kontroller_purge_interval
                    style:
                      left: 55.9%
                      top: 33.2%
                      transform: translate(-50%, -50%)
                      font-size: 34px
                      font-weight: bold
                      font-family: Arial, Helvetica, sans-serif
                      color: '#ff3b30'
                      text-shadow: 0 0 8px rgba(255, 59, 48, 0.8)
                      pointer-events: none
              - type: conditional
                conditions:
                  - condition: state
                    entity: input_select.kotel_display_mode
                    state: '7'
                elements:
                  - type: state-label
                    entity: number.kotel_kontroller_target_temperature_min
                    style:
