  - title: Профили
    path: profiles
    icon: mdi:content-save-cog
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Профиль котла
            heading_style: title
            icon: mdi:fire
          - type: markdown
            content: >
              Сохраняет **14 настроек котла**: уставки max/min, температуру
              насоса, коррекцию, время и интервал продувки, вентилятор min/max,
              время угасания, интервалы и время работы шнека, интервал
              автореверса. Старт/стоп и включение климата в профиль **не входят**
              — это защита от случайного отключения.
          - type: entities
            title: Текущее состояние
            show_header_toggle: false
            entities:
              - entity: sensor.kotel_kontroller_active_boiler_profile
                name: Активный профиль
              - entity: select.kotel_kontroller_boiler_profile
                name: Выбранный профиль
          - type: heading
            heading: Применение и откат
            heading_style: subtitle
            icon: mdi:check-bold
          - type: tile
            entity: button.kotel_kontroller_apply_boiler_profile
            name: Применить выбранный
            icon: mdi:check-bold
            vertical: true
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.kotel_kontroller_apply_boiler_profile
              confirmation:
                text: Применить профиль котла к контроллеру?
          - type: tile
            entity: button.kotel_kontroller_undo_boiler_profile
            name: Отменить применение
            icon: mdi:undo
            vertical: true
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.kotel_kontroller_undo_boiler_profile
              confirmation:
                text: Вернуть прежние настройки котла?
          - type: entities
            title: Сохранение
            show_header_toggle: false
            entities:
              - entity: text.kotel_kontroller_new_boiler_profile_name
                name: Имя нового профиля
              - entity: button.kotel_kontroller_save_boiler_profile
                name: Сохранить как новый
              - entity: button.kotel_kontroller_update_boiler_profile
                name: Обновить выбранный
              - entity: button.kotel_kontroller_delete_boiler_profile
