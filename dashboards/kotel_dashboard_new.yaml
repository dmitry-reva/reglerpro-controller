                      top: 33.2%
                      transform: translate(-50%, -50%)
                      font-size: 34px
                      font-weight: bold
                      font-family: Arial, Helvetica, sans-serif
                      color: '#ff3b30'
                      text-shadow: 0 0 8px rgba(255, 59, 48, 0.8)
                      pointer-events: none
              - type: conditional
                conditions:
                  - condition: state
                    entity: input_select.kotel_display_mode
                    state: '8'
                elements:
                  - type: state-label
                    entity: number.kotel_kontroller_burnout_time
                    style:
                      left: 55.9%
                      top: 33.2%
                      transform: translate(-50%, -50%)
                      font-size: 34px
                      font-weight: bold
                      font-family: Arial, Helvetica, sans-serif
                      color: '#ff3b30'
                      text-shadow: 0 0 8px rgba(255, 59, 48, 0.8)
                      pointer-events: none
              - type: conditional
                conditions:
                  - condition: state
                    entity: input_select.kotel_display_mode
                    state: '9'
                elements:
                  - type: state-label
                    entity: number.kotel_kontroller_pump_temperature
                    style:
                      left: 55.9%
                      top: 33.2%
                      transform: translate(-50%, -50%)
                      font-size: 34px
                      font-weight: bold
                      font-family: Arial, Helvetica, sans-serif
                      color: '#ff3b30'
                      text-shadow: 0 0 8px rgba(255, 59, 48, 0.8)
                      pointer-events: none
              - type: conditional
                conditions:
                  - condition: state
                    entity: input_select.kotel_display_mode
                    state: A
                elements:
                  - type: state-label
                    entity: number.kotel_kontroller_fan_min
                    style:
                      left: 55.9%
                      top: 33.2%
                      transform: translate(-50%, -50%)
                      font-size: 34px
                      font-weight: bold
                      font-family: Arial, Helvetica, sans-serif
                      color: '#ff3b30'
                      text-shadow: 0 0 8px rgba(255, 59, 48, 0.8)
                      pointer-events: none
              - type: conditional
                conditions:
                  - condition: state
                    entity: input_select.kotel_display_mode
                    state: B
                elements:
                  - type: state-label
                    entity: number.kotel_kontroller_temperature_correction
                    style:
                      left: 55.9%
                      top: 33.2%
                      transform: translate(-50%, -50%)
                      font-size: 34px
                      font-weight: bold
                      font-family: Arial, Helvetica, sans-serif
                      color: '#ff3b30'
                      text-shadow: 0 0 8px rgba(255, 59, 48, 0.8)
                      pointer-events: none
              - type: conditional
                conditions:
                  - condition: state
                    entity: input_select.kotel_display_mode
                    state: E
                elements:
                  - type: state-label
                    entity: sensor.kotel_kontroller_climate_sensor_temperature
                    style:
                      left: 55.9%
                      top: 33.2%
                      transform: translate(-50%, -50%)
                      font-size: 34px
                      font-weight: bold
                      font-family: Arial, Helvetica, sans-serif
                      color: '#ff3b30'
                      text-shadow: 0 0 8px rgba(255, 59, 48, 0.8)
                      pointer-events: none
              - type: conditional
                conditions:
                  - condition: state
                    entity: input_select.kotel_display_mode
                    state: S
                elements:
                  - type: state-label
                    entity: sensor.kotel_kontroller_auger_temperature
                    style:
                      left: 55.9%
                      top: 33.2%
                      transform: translate(-50%, -50%)
                      font-size: 34px
                      font-weight: bold
                      font-family: Arial, Helvetica, sans-serif
                      color: '#ff3b30'
                      text-shadow: 0 0 8px rgba(255, 59, 48, 0.8)
                      pointer-events: none
              - type: state-label
                entity: input_select.kotel_display_mode
                style:
                  left: 44%
                  top: 26%
                  transform: translate(-50%, -50%)
                  font-size: 14px
                  font-weight: bold
                  font-family: Arial, Helvetica, sans-serif
                  color: '#ff3b30'
                  opacity: 0.8
                  pointer-events: none
              - type: state-icon
                entity: switch.kotel_kontroller_start_stop
                icon: mdi:power
                tap_action:
                  action: toggle
                  confirmation:
                    text: Переключить котёл?
                style:
                  left: 82.9%
                  top: 26.7%
                  transform: translate(-50%, -50%)
                  --mdc-icon-size: 34px
                  opacity: 0.35
              - type: state-icon
                entity: input_select.kotel_display_mode
                icon: mdi:alpha-f-box-outline
                tap_action:
                  action: perform-action
                  perform_action: input_select.select_next
                  target:
                    entity_id: input_select.kotel_display_mode
                  data:
                    cycle: true
                style:
                  left: 83%
                  top: 74%
                  transform: translate(-50%, -50%)
                  --mdc-icon-size: 34px
                  opacity: 0.35
              - type: conditional
                conditions:
                  - condition: state
                    entity: sensor.kotel_kontroller_fan_on
                    state: да
                elements:
                  - type: icon
                    icon: mdi:circle
                    style:
                      left: 52%
                      top: 67.5%
                      transform: translate(-50%, -50%)
                      color: '#00e676'
                      --mdc-icon-size: 16px
              - type: conditional
                conditions:
                  - condition: state
                    entity: sensor.kotel_kontroller_operating_state
                    state: Розжиг/Угасание
                elements:
                  - type: icon
                    icon: mdi:circle
                    style:
                      left: 52%
                      top: 76%
                      transform: translate(-50%, -50%)
                      color: '#ffab00'
                      --mdc-icon-size: 16px
              - type: conditional
                conditions:
                  - condition: state
                    entity: sensor.kotel_kontroller_connection_status
                    state: online
                elements:
                  - type: icon
                    icon: mdi:circle
                    style:
                      left: 52%
                      top: 83.6%
                      transform: translate(-50%, -50%)
                      color: '#00e676'
                      --mdc-icon-size: 16px
              - type: conditional
                conditions:
                  - condition: state
                    entity: sensor.kotel_kontroller_climate_enabled
                    state: да
                elements:
                  - type: icon
                    icon: mdi:circle
                    style:
                      left: 52%
                      top: 91%
                      transform: translate(-50%, -50%)
                      color: '#00e676'
                      --mdc-icon-size: 16px
            grid_options:
              columns: full
          - type: history-graph
            entities:
              - entity: sensor.kotel_kontroller_water_temperature
                name: Вода
              - entity: sensor.kotel_kontroller_target_temperature_max
                name: Уставка макс.
              - entity: sensor.kotel_kontroller_target_temperature_min
                name: Уставка мин.
              - entity: sensor.kotel_kontroller_climate_sensor_temperature
                name: Помещение
              - entity: sensor.kotel_kontroller_climate_target_temperature
                name: Цель климата
            hours_to_show: 4
            show_names: false
      - type: grid
        cards:
          - type: heading
            heading: Контроллер
            heading_style: title
            icon: mdi:fire
            badges:
              - type: entity
                entity: sensor.kotel_kontroller_connection_status
                show_state: true
                show_icon: true
              - type: entity
                entity: sensor.kotel_kontroller_active_boiler_profile
                show_state: true
                show_icon: true
              - type: entity
                entity: sensor.kotel_kontroller_active_climate_profile
                show_state: true
                show_icon: true
          - type: conditional
            conditions:
              - condition: or
                conditions:
                  - condition: state
                    entity: sensor.kotel_kontroller_water_alarm
                    state: да
                  - condition: state
                    entity: sensor.kotel_kontroller_auger_failure
                    state: да
                  - condition: state
                    entity: sensor.kotel_kontroller_water_temperature_sensor_error
                    state: да
                  - condition: state
                    entity: sensor.kotel_kontroller_auger_temperature_sensor_error
                    state: да
                  - condition: state
                    entity: sensor.kotel_kontroller_triac_error
                    state: да
            card:
              type: markdown
              content: |
                ## ⚠️ Неисправность котла
                Проверьте аварии и ошибки в разделе **Диагностика**.
          - type: gauge
            entity: sensor.kotel_kontroller_climate_sensor_temperature
            min: 10
            max: 50
            needle: true
            segments:
              - from: 10
                color: '#4fc3f7'
              - from: 22
                color: '#66bb6a'
              - from: 26
                color: '#ffa726'
              - from: 30
                color: '#ef5350'
            name:
              type: entity
          - type: tile
            entity: sensor.kotel_kontroller_water_temperature
            name: Температура воды
            icon: mdi:water-thermometer
            vertical: true
            grid_options:
              columns: 12
              rows: 3
            features:
              - type: trend-graph
          - type: tile
            entity: sensor.kotel_kontroller_operating_state
            name: Состояние
            icon: mdi:state-machine
            vertical: true
          - type: tile
            entity: sensor.kotel_kontroller_connection_status
            name: Связь
            icon: mdi:wifi
            vertical: true
      - type: grid
        cards:
          - type: heading
            heading: Управление
            heading_style: title
            icon: mdi:tune
          - type: tile
            entity: switch.kotel_kontroller_start_stop
            name: Старт / Стоп
            icon: mdi:power
            vertical: true
            tap_action:
              action: toggle
              confirmation:
                text: Переключить котёл?
          - type: tile
            entity: number.kotel_kontroller_target_temperature_max
            name: Уставка (макс.)
            icon: mdi:thermometer-high
            vertical: true
          - type: tile
            entity: number.kotel_kontroller_target_temperature_min
            name: Уставка (мин.)
            icon: mdi:thermometer-low
            vertical: true
          - type: tile
            entity: number.kotel_kontroller_temperature_correction
            name: Коррекция
            icon: mdi:thermometer-plus
            vertical: true
  - title: Климат
    path: climate
    icon: mdi:home-thermometer
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Режим
            heading_style: title
          - type: thermostat
            entity: climate.kotel_kontroller_thermostat
            features:
              - type: climate-hvac-modes
                hvac_modes:
                  - 'off'
                  - heat
                  - auto
              - type: climate-preset-modes
                style: dropdown
                preset_modes:
                  - Расписание 7/7
                  - Расписание 5/2
                  - Расписание 4/1/2
          - type: entities
            title: Датчик климата
            entities:
              - entity: select.kotel_kontroller_climate_sensor
              - entity: sensor.kotel_kontroller_climate_sensor_temperature
