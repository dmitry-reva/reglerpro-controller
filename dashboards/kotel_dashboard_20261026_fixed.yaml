                      font-size: 34px
                      font-weight: bold
                      font-family: Arial, Helvetica, sans-serif
                      color: '#ff3b30'
                      text-shadow: 0 0 8px rgba(255, 59, 48, 0.8)
                      pointer-events: none
              - type: conditional
                conditions:
                  - condition: state
                    entity: input_select.kotel_display_mode
                    state: A
                elements:
                  - type: state-label
                    entity: number.kotel_kontroller_ventiliator_min
                    style:
                      left: 55.9%
                      top: 33.2%
                      transform: translate(-50%, -50%)
                      font-size: 34px
                      font-weight: bold
                      font-family: Arial, Helvetica, sans-serif
                      color: '#ff3b30'
                      text-shadow: 0 0 8px rgba(255, 59, 48, 0.8)
