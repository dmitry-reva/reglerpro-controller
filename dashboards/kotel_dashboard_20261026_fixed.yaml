# Панель Home Assistant «Котёл» — исправленная версия (структура секций и идентификаторы).
# Применение: Настройки → Панели → ваша панель → ⋮ → Raw configuration editor.
title: Котёл
views:
  - title: Обзор
    path: overview
    icon: mdi:fire
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: picture-elements
            image: /local/kotel/controller.png
            elements:
              - type: conditional
                conditions:
                  - condition: state
                    entity: input_select.kotel_display_mode
                    state: '1'
                elements:
                  - type: state-label
                    entity: sensor.kotel_kontroller_temperatura_vody
                    style:
                      left: 55.9%
                      top: 33.2%
                      transform: translate(-50%, -50%)
                      font-size: 34px
                      font-weight: bold
                      font-family: Arial, Helvetica, sans-serif
                      color: '#ff3b30'
                      text-shadow: 0 0 8px rgba(255, 59, 48, 0.8)
                      pointer-events: none
