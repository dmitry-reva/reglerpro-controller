# =============================================================================
#  Дашборд «Котёл» для интеграции Kotel (ReglerPro Controller)
#  Только штатные карточки Home Assistant — HACS-расширения не нужны.
#
#  КАК ПОДКЛЮЧИТЬ
#   1. Скопируйте www/kotel/controller.png в /config/www/kotel/controller.png
#      (если папки www не было — перезапустите Home Assistant).
#   2. Настройки → Панели → Добавить панель → «Новая панель с нуля».
#   3. ⋮ → «Изменить» → ⋮ → «Raw configuration editor» и вставьте этот файл.
#   4. Замените ID сущностей (см. таблицу ниже) на свои:
#      Настройки → Устройства и службы → Kotel → устройство → сущность → ⚙.
#      В редакторе работает поиск с заменой: Ctrl+H.
#
#  ID СУЩНОСТЕЙ (ожидаемые; у вас они могут отличаться)
# =============================================================================
title: Котёл
views:
  - title: Контроллер
    path: kotel
    icon: mdi:fire
    cards:

      # ---- 1. «Живая» панель контроллера ------------------------------------
      - type: picture-elements
        image: /local/kotel/controller.png
        elements:
          # Дисплей: значение выбранного параметра (источник — sensor.kotel_display)
          - type: state-label
            entity: sensor.kotel_display
            style:
              left: 55.9%
              top: 33.2%
              transform: translate(-50%, -50%)
              font-size: 34px
              font-weight: bold
              font-family: '"Courier New", monospace'
              color: "#ff3b30"
              text-shadow: 0 0 8px rgba(255, 59, 48, 0.8)
              pointer-events: none

          # Код выбранного параметра (мелко в левой части дисплея)
          - type: state-label
            entity: input_select.kotel_display_mode
            style:
              left: 44%
              top: 26%
              transform: translate(-50%, -50%)
              font-size: 14px
              font-weight: bold
              font-family: '"Courier New", monospace'
              color: "#ff3b30"
              opacity: 0.8
              pointer-events: none

          # Кнопка START/STOP (нажатие переключает котёл)
          - type: state-icon
            entity: switch.kotel_kontroller_start_stop
            icon: mdi:power
            tap_action:
              action: toggle
            style:
              left: 82.9%
              top: 26.7%
              transform: translate(-50%, -50%)
              "--mdc-icon-size": 34px
              opacity: 0.35

          # Кнопка F: каждое нажатие выбирает следующий параметр для дисплея
          - type: state-icon
            entity: input_select.kotel_display_mode
            icon: mdi:alpha-f-box-outline
            tap_action:
              action: perform-action
              perform_action: input_select.select_next
              target:
                entity_id: input_select.kotel_display_mode
              data:
                cycle: true
            style:
              left: 83%
              top: 74%
              transform: translate(-50%, -50%)
              "--mdc-icon-size": 34px
              opacity: 0.35

          # Индикатор «ВЕНТИЛЯТОР»
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.kotel_kontroller_ventiliator_vkliuchen
                state: "1"
            elements:
              - type: icon
                icon: mdi:circle
                style: &led
                  left: 52%
                  top: 67.5%
                  transform: translate(-50%, -50%)
                  color: "#00e676"
                  "--mdc-icon-size": 16px

          # Индикатор «РОЗЖИГ/УГАСАНИЕ» (состояние = 2)
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.kotel_kontroller_sostoianie
                state: Розжиг/Угасание
            elements:
              - type: icon
                icon: mdi:circle
                style:
                  <<: *led
                  top: 76%
                  color: "#ffab00"

          # Индикатор «WiFi» (связь с облаком)
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.kotel_kontroller_status_podkliucheniia
                state: online
            elements:
              - type: icon
                icon: mdi:circle
                style:
                  <<: *led
                  top: 83.6%

          # Индикатор «КОМНАТА t°» (климат-контроль включён)
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.kotel_kontroller_klimat_vkliuchen
                state: "1"
            elements:
              - type: icon
                icon: mdi:circle
                style:
                  <<: *led
                  top: 91%

          # «ШНЕК» и «НАСОС»: отдельных датчиков в params нет.
          # Когда выясните, какие параметры за них отвечают, добавьте такие же
          # блоки conditional с top: 50% (ШНЕК) и top: 59.6% (НАСОС).

      # ---- 2. Аварии (видны только при неисправности) -----------------------
      - type: conditional
        conditions:
          - condition: or
            conditions:
              - condition: state
                entity: sensor.kotel_kontroller_trevoga_po_vode
                state_not: "0"
              - condition: state
                entity: sensor.kotel_kontroller_avariia_shneka
                state_not: "0"
              - condition: state
                entity: sensor.kotel_kontroller_oshibka_datchika_t_vody
                state_not: "0"
              - condition: state
                entity: sensor.kotel_kontroller_oshibka_datchika_t_shneka
                state_not: "0"
              - condition: state
                entity: sensor.kotel_kontroller_oshibka_simistora
                state_not: "0"
        card:
          type: markdown
          content: >
            ## ⚠️ Неисправность котла

            Тревога по воде: **{{ states('sensor.kotel_kontroller_trevoga_po_vode') }}**  ·
            Авария шнека: **{{ states('sensor.kotel_kontroller_avariia_shneka') }}**  ·
            Датчик воды: **{{ states('sensor.kotel_kontroller_oshibka_datchika_t_vody') }}**  ·
            Датчик шнека: **{{ states('sensor.kotel_kontroller_oshibka_datchika_t_shneka') }}**  ·
            Симистор: **{{ states('sensor.kotel_kontroller_oshibka_simistora') }}**

      # ---- 3. Температура воды: стрелочный индикатор ------------------------
      - type: gauge
        entity: sensor.kotel_kontroller_klimat_temperatura_datchika
        name: Датчик климата
        min: 10
        max: 50
        needle: true
        segments:
          - from: 10
            color: '#4fc3f7'
          - from: 22
            color: '#66bb6a'
          - from: 26
            color: '#ffa726'
          - from: 30
            color: '#ef5350'

      # ---- 4. Сводка состояния ----------------------------------------------
      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: sensor.kotel_kontroller_sostoianie
            name: Состояние
            vertical: true
          - type: tile
            entity: sensor.kotel_kontroller_klimat_kontrol
            name: Климат-контроль
            vertical: true
          - type: tile
            entity: sensor.kotel_kontroller_ustavka_temperatury_max
            name: Уставка (max)
            vertical: true
          - type: tile
            entity: sensor.kotel_kontroller_ustavka_temperatury_min
            name: Уставка (min)
            vertical: true
      

      # ---- 5. График за сутки -----------------------------------------------
      - type: history-graph
        title: Температура за 24 часа
        hours_to_show: 24
        entities:
          - entity: sensor.kotel_kontroller_temperatura_vody
            name: Вода
          - entity: sensor.kotel_kontroller_ustavka_temperatury_max
            name: Уставка max
          - entity: sensor.kotel_kontroller_ustavka_temperatury_min
            name: Уставка min

      # ---- 5+. Температура шнека -----------------------------------------------------
      - type: tile
        entity: sensor.kotel_kontroller_temperatura_shneka
        name: Температура шнека
        vertical: false
        grid_options:
          rows: 2
          columns: full
        features:
          - type: trend-graph
        features_position: bottom

      # ---- 6. Управление -----------------------------------------------------
      - type: entities
        title: Управление
        show_header_toggle: false
        entities:
          - entity: switch.kotel_kontroller_start_stop
            name: Старт / Стоп
          - entity: number.kotel_kontroller_ustavka_temperatury_max
          - entity: number.kotel_kontroller_ustavka_temperatury_min
          - entity: number.kotel_kontroller_korrektsiia_temperatury

      # ---- 7. Диагностика ----------------------------------------------------
      - type: entities
        title: Диагностика
        entities:
          - entity: sensor.kotel_kontroller_status_podkliucheniia
          - entity: sensor.kotel_kontroller_diagnostika_parametrov
            name: Разобрано параметров
          - type: attribute
            entity: sensor.kotel_kontroller_diagnostika_parametrov
            attribute: params_format
            name: Формат params
          - type: attribute
            entity: sensor.kotel_kontroller_diagnostika_parametrov
            attribute: params_raw
            name: Строка params
