# =============================================================================
#  Дашборд «Котёл» для интеграции Kotel (ReglerPro Controller)
#  Только штатные карточки Home Assistant — HACS-расширения не нужны.
#
#  КАК ПОДКЛЮЧИТЬ
#   1. Скопируйте www/kotel/controller.png в /config/www/kotel/controller.png
#      (если папки www не было — перезапустите Home Assistant).
#   2. Настройки → Панели → Добавить панель → «Новая панель с нуля».
#   3. ⋮ → «Изменить» → ⋮ → «Raw configuration editor» и вставьте этот файл.
#   4. Замените ID сущностей (см. таблицу ниже) на свои:
#      Настройки → Устройства и службы → Kotel → устройство → сущность → ⚙.
#      В редакторе работает поиск с заменой: Ctrl+H.
#
#  ID СУЩНОСТЕЙ (пример; у вас могут отличаться)
#   sensor.kotel_kontroller_temperatura_vody          температура воды
#   sensor.kotel_kontroller_ustavka_temperatury_max   уставка max
#   sensor.kotel_kontroller_ustavka_temperatury_min   уставка min
#   sensor.kotel_kontroller_sostoianie_raboty                состояние работы
#   sensor.kotel_kontroller_klimat_kontrol            климат: нагрев/охлаждение
#   sensor.kotel_kontroller_status_podkliucheniia     online / offline
#   sensor.kotel_kontroller_ventiliator_vkliuchen     вентилятор: да / нет
#   sensor.kotel_kontroller_klimat_vkliuchen          климат включён: да / нет
#   sensor.kotel_kontroller_trevoga_po_vode           аварии и ошибки: да / нет
#   switch.kotel_kontroller_start_stop                старт/стоп
#   number.kotel_kontroller_*                         настройки (ползунки)
#  Замените префикс kotel_kontroller на свой: карточка устройства → сущность → ⚙.
# =============================================================================
title: Котёл
views:
  - title: Контроллер
    path: kotel
    icon: mdi:fire
    cards:

      # ---- 1. «Живая» панель контроллера ------------------------------------
      - type: picture-elements
        image: /local/kotel/controller.png
        elements:
          # Дисплей: значение выбранного параметра.
          # Режим хранит input_select.kotel_display_mode (кнопка F), для каждого режима —
          # свой элемент; шаблонный сенсор не нужен. Если ID неверный, в этом режиме
          # на дисплее будет жёлтый знак: поправьте entity в соответствующем блоке.
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.kotel_display_mode
                state: "1"
            elements:
              - type: state-label
                entity: sensor.kotel_kontroller_temperatura_vody
                style: &disp
                  left: 55.9%
                  top: 33.2%
                  transform: translate(-50%, -50%)
                  font-size: 34px
                  font-weight: bold
                  font-family: Arial, Helvetica, sans-serif
                  color: "#ff3b30"
                  text-shadow: 0 0 8px rgba(255, 59, 48, 0.8)
                  pointer-events: none

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.kotel_display_mode
                state: "2"
            elements:
              - type: state-label
                entity: number.kotel_kontroller_ventiliator_max
                style: *disp

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.kotel_display_mode
                state: "3"
            elements:
              - type: state-label
                entity: sensor.kotel_kontroller_shnek_interval_nagrev
                style: *disp

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.kotel_display_mode
                state: "4"
            elements:
              - type: state-label
                entity: sensor.kotel_kontroller_shnek_interval_podderzhanie
                style: *disp

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.kotel_display_mode
                state: "5"
            elements:
              - type: state-label
                entity: number.kotel_kontroller_vremia_produvki
                style: *disp

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.kotel_display_mode
                state: "6"
            elements:
              - type: state-label
                entity: number.kotel_kontroller_interval_produvki
                style: *disp

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.kotel_display_mode
                state: "7"
            elements:
              - type: state-label
                entity: number.kotel_kontroller_ustavka_temperatury_min
                style: *disp

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.kotel_display_mode
                state: "8"
            elements:
              - type: state-label
                entity: number.kotel_kontroller_vremia_ugasaniia
                style: *disp

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.kotel_display_mode
                state: "9"
            elements:
              - type: state-label
                entity: number.kotel_kontroller_temperatura_nasosa
                style: *disp

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.kotel_display_mode
                state: "A"
            elements:
              - type: state-label
                entity: number.kotel_kontroller_ventiliator_min
                style: *disp

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.kotel_display_mode
                state: "B"
            elements:
              - type: state-label
                entity: number.kotel_kontroller_korrektsiia_temperatury
                style: *disp

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.kotel_display_mode
                state: "E"
            elements:
              - type: state-label
                entity: sensor.kotel_kontroller_klimat_temperatura_datchika
                style: *disp

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.kotel_display_mode
                state: "S"
            elements:
              - type: state-label
                entity: sensor.kotel_kontroller_temperatura_shneka
                style: *disp

          # Код выбранного параметра (мелко в левой части дисплея)
          - type: state-label
            entity: input_select.kotel_display_mode
            style:
              left: 44%
              top: 26%
              transform: translate(-50%, -50%)
              font-size: 14px
              font-weight: bold
              font-family: Arial, Helvetica, sans-serif
              color: "#ff3b30"
              opacity: 0.8
              pointer-events: none

          # Кнопка START/STOP (нажатие переключает котёл)
          - type: state-icon
            entity: switch.kotel_kontroller_start_stop
            icon: mdi:power
            tap_action:
              action: toggle
            style:
              left: 82.9%
              top: 26.7%
              transform: translate(-50%, -50%)
              "--mdc-icon-size": 34px
              opacity: 0.35

          # Кнопка F: каждое нажатие выбирает следующий параметр для дисплея
          - type: state-icon
            entity: input_select.kotel_display_mode
            icon: mdi:alpha-f-box-outline
            tap_action:
              action: perform-action
              perform_action: input_select.select_next
              target:
                entity_id: input_select.kotel_display_mode
              data:
                cycle: true
            style:
              left: 83%
              top: 74%
              transform: translate(-50%, -50%)
              "--mdc-icon-size": 34px
              opacity: 0.35

          # Индикатор «ВЕНТИЛЯТОР»
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.kotel_kontroller_ventiliator_vkliuchen
                state: "да"
            elements:
              - type: icon
                icon: mdi:circle
                style: &led
                  left: 52%
                  top: 67.5%
                  transform: translate(-50%, -50%)
                  color: "#00e676"
                  "--mdc-icon-size": 16px

          # Индикатор «РОЗЖИГ/УГАСАНИЕ» (состояние = 2)
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.kotel_kontroller_sostoianie_raboty
                state: Розжиг/Угасание
            elements:
              - type: icon
                icon: mdi:circle
                style:
                  <<: *led
                  top: 76%
                  color: "#ffab00"

          # Индикатор «WiFi» (связь с облаком)
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.kotel_kontroller_status_podkliucheniia
                state: online
            elements:
              - type: icon
                icon: mdi:circle
                style:
                  <<: *led
                  top: 83.6%

          # Индикатор «КОМНАТА t°» (климат-контроль включён)
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.kotel_kontroller_klimat_vkliuchen
                state: "да"
            elements:
              - type: icon
                icon: mdi:circle
                style:
                  <<: *led
                  top: 91%

          # «ШНЕК» и «НАСОС»: отдельных датчиков в params нет.
          # Когда выясните, какие параметры за них отвечают, добавьте такие же
          # блоки conditional с top: 50% (ШНЕК) и top: 59.6% (НАСОС).

      # ---- 2. Аварии (видны только при неисправности) -----------------------
      - type: conditional
        conditions:
          - condition: or
            conditions:
              - condition: state
                entity: sensor.kotel_kontroller_trevoga_po_vode
                state: "да"
              - condition: state
                entity: sensor.kotel_kontroller_avariia_shneka
                state: "да"
              - condition: state
                entity: sensor.kotel_kontroller_oshibka_datchika_temperatury_vody
                state: "да"
              - condition: state
                entity: sensor.kotel_kontroller_oshibka_datchika_temperatury_shneka
                state: "да"
              - condition: state
                entity: sensor.kotel_kontroller_oshibka_simistora
                state: "да"
        card:
          type: markdown
          content: >
            ## ⚠️ Неисправность котла

            Тревога по воде: **{{ states('sensor.kotel_kontroller_trevoga_po_vode') }}**  ·
            Авария шнека: **{{ states('sensor.kotel_kontroller_avariia_shneka') }}**  ·
            Датчик воды: **{{ states('sensor.kotel_kontroller_oshibka_datchika_temperatury_vody') }}**  ·
            Датчик шнека: **{{ states('sensor.kotel_kontroller_oshibka_datchika_temperatury_shneka') }}**  ·
            Симистор: **{{ states('sensor.kotel_kontroller_oshibka_simistora') }}**

      # ---- 2+. Термостат (климат-контроль) ----------------------------------
      - type: thermostat
        entity: climate.kotel_kontroller_termostat   # замените на ID вашего термостата
        name: Термостат
        features:
          - type: climate-hvac-modes
            hvac_modes:
              - "off"
              - heat
              - auto
          - type: climate-preset-modes
            style: dropdown
            preset_modes:
              - Расписание 7/7
              - Расписание 5/2
              - Расписание 4/1/2

      # ---- 3. Температура помещения: стрелочный индикатор -------------------
      - type: gauge
        entity: sensor.kotel_kontroller_klimat_temperatura_datchika
        name: Датчик климата
        min: 10
        max: 50
        needle: true
        segments:
          - from: 10
            color: '#4fc3f7'
          - from: 22
            color: '#66bb6a'
          - from: 26
            color: '#ffa726'
          - from: 30
            color: '#ef5350'

      # ---- 4. Сводка состояния ----------------------------------------------
      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: sensor.kotel_kontroller_sostoianie_raboty
            name: Состояние
            vertical: true
          - type: tile
            entity: sensor.kotel_kontroller_klimat_kontrol
            name: Климат-контроль
            vertical: true
          - type: tile
            entity: sensor.kotel_kontroller_ustavka_temperatury_max
            name: Уставка (max)
            vertical: true
          - type: tile
            entity: sensor.kotel_kontroller_ustavka_temperatury_min
            name: Уставка (min)
            vertical: true
      

      # ---- 5. График за сутки -----------------------------------------------
      - type: history-graph
        title: Температура за 24 часа
        hours_to_show: 24
        entities:
          - entity: sensor.kotel_kontroller_temperatura_vody
            name: Вода
          - entity: sensor.kotel_kontroller_ustavka_temperatury_max
            name: Уставка max
          - entity: sensor.kotel_kontroller_ustavka_temperatury_min
            name: Уставка min

      # ---- 5+. Температура шнека -----------------------------------------------------
      - type: tile
        entity: sensor.kotel_kontroller_temperatura_shneka
        name: Температура шнека
        vertical: false
        grid_options:
          rows: 2
          columns: full
        features:
          - type: trend-graph
        features_position: bottom

      # ---- 6. Управление -----------------------------------------------------
      - type: entities
        title: Управление
        show_header_toggle: false
        entities:
          - entity: switch.kotel_kontroller_start_stop
            name: Старт / Стоп
          - entity: number.kotel_kontroller_ustavka_temperatury_max
          - entity: number.kotel_kontroller_ustavka_temperatury_min
          - entity: number.kotel_kontroller_korrektsiia_temperatury

      # ---- 6+. Профили котла -------------------------------------------------
      # ID у существующих установок остаются прежними (без суффикса «котла»).
      # ID замените на свои (карточка устройства → сущность → ⚙).
      - type: entities
        title: Профили котла
        show_header_toggle: false
        entities:
          - entity: sensor.kotel_kontroller_aktivnyi_profil
            name: Активный профиль
          - entity: select.kotel_kontroller_profil
            name: Профиль котла
          - entity: button.kotel_kontroller_primenit_profil
            name: Применить выбранный
          - entity: button.kotel_kontroller_otmenit_primenenie
            name: Отменить применение
          - type: section
          - entity: text.kotel_kontroller_imia_novogo_profilia
            name: Имя нового профиля
          - entity: button.kotel_kontroller_sokhranit_profil
            name: Сохранить как новый
          - entity: button.kotel_kontroller_obnovit_profil
            name: Обновить выбранный

      # ---- 6++. Профили климата (режим, цель, расписание) -------------------
      # Применяются и откатываются независимо от профилей котла.
      - type: entities
        title: Профили климата
        show_header_toggle: false
        entities:
          - entity: sensor.kotel_kontroller_aktivnyi_profil_klimata
            name: Активный профиль
          - entity: select.kotel_kontroller_profil_klimata
            name: Профиль климата
          - entity: button.kotel_kontroller_primenit_profil_klimata
            name: Применить выбранный
          - entity: button.kotel_kontroller_otmenit_primenenie_klimat
            name: Отменить применение
          - type: section
          - entity: text.kotel_kontroller_imia_novogo_profilia_klimata
            name: Имя нового профиля
          - entity: button.kotel_kontroller_sokhranit_profil_klimata
            name: Сохранить как новый
          - entity: button.kotel_kontroller_obnovit_profil_klimata
            name: Обновить выбранный

      # ---- 7. Диагностика ----------------------------------------------------
      - type: entities
        title: Диагностика
        entities:
          - entity: sensor.kotel_kontroller_status_podkliucheniia
          - entity: sensor.kotel_kontroller_diagnostika_parametrov
            name: Разобрано параметров
          - type: attribute
            entity: sensor.kotel_kontroller_diagnostika_parametrov
            attribute: params_format
            name: Формат params
          - type: attribute
            entity: sensor.kotel_kontroller_diagnostika_parametrov
            attribute: params_raw
            name: Строка params
